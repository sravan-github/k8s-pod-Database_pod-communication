apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: app-demo
type: Opaque
# Values are base64-encoded. Decode: echo -n "value" | base64
# postgres        -> cG9zdGdyZXM=
# postgrespassword -> cG9zdGdyZXNwYXNzd29yZA==
# appdb           -> YXBwZGI=
data:
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_PASSWORD: cG9zdGdyZXNwYXNzd29yZA==
  POSTGRES_DB: YXBwZGI=
