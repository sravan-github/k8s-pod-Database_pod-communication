apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: app-demo
  labels:
    app: nodeapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodeapp
  template:
    metadata:
      labels:
        app: nodeapp
    spec:
      # Wait for the postgres Service DNS to resolve before starting
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432; do
                echo "Waiting for postgres-service:5432..."
                sleep 2
              done
              echo "PostgreSQL is ready."
      containers:
        - name: nodeapp
          image: sravangcpdocker/nodeapp:latest   # Replace with your built image
          ports:
            - containerPort: 3000
          env:
            # Kubernetes DNS resolves "postgres-service" within the same namespace
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: app-demo
  labels:
    app: nodeapp
spec:
  type: LoadBalancer       # Expose externally; use NodePort for bare-metal/minikube
  selector:
    app: nodeapp
  ports:
    - name: http
      port: 80
      targetPort: 3000
